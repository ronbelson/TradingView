<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BTC CHEF">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="hat" x1="16" y1="10" x2="48" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7e08a"/>
      <stop offset="1" stop-color="#e3b341"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- chef hat -->
  <ellipse cx="32" cy="22" rx="14" ry="10" fill="url(#hat)"/>
  <ellipse cx="22" cy="20" rx="7" ry="6.5" fill="#f7e08a"/>
  <ellipse cx="42" cy="20" rx="7" ry="6.5" fill="#f0d36a"/>
  <ellipse cx="32" cy="16" rx="8" ry="7" fill="#ffe9a8"/>
  <rect x="17" y="26" width="30" height="7" rx="3.5" fill="#e3b341"/>
  <rect x="19" y="27.5" width="26" height="3" rx="1.5" fill="#fff2c4" opacity="0.55"/>

  <!-- candle chart under hat -->
  <g stroke-linecap="round">
    <path d="M20 48 V42" stroke="#8b949e" stroke-width="1.6"/>
    <rect x="17.5" y="44" width="5" height="7" rx="1" fill="#3fb950"/>
    <path d="M32 50 V38" stroke="#8b949e" stroke-width="1.6"/>
    <rect x="29.5" y="40" width="5" height="10" rx="1" fill="#3fb950"/>
    <path d="M44 49 V41" stroke="#8b949e" stroke-width="1.6"/>
    <rect x="41.5" y="43" width="5" height="8" rx="1" fill="#ff7b72"/>
  </g>

  <!-- small B mark -->
  <text x="32" y="58.5" text-anchor="middle" font-family="ui-rounded, system-ui, sans-serif" font-size="7" font-weight="800" fill="#58a6ff">B</text>
</svg>
